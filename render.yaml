services:
  - type: web
    name: dailyhabits-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && cd DailyHabits && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: cd DailyHabits && gunicorn DailyHabits.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: 3.13.2
