services:
  - type: web
    name: dailyhabits-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && cd DailyHabits && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: cd DailyHabits && gunicorn DailyHabits.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
