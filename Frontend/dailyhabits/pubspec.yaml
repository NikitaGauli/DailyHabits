name: dailyhabits
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  
  # UI & State Management
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  
  # Networking & Storage
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^3.0.2
  fl_chart: ^0.66.0
  intl: ^0.19.0

  # Google Authentication
  google_sign_in: ^6.2.2

  # PDF export — save to device & preview / open
  path_provider: ^2.1.2
  open_filex: ^4.5.0

  # Web platform support
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    